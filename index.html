<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Berita SMK Muhammadiyah Todanan</title>
<meta name="theme-color" content="#1B2E6E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Berita Muhada">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/smartcrop@2.0.5/smartcrop.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --biru-tua:#1B2E6E;
    --biru-terang:#1A6FE8;
    --oranye:#F28C00;
    --ink:#0E1730;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }

  #app{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- Slides ---------- */
  .slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 900ms ease;
    background-size:cover;
    background-position:center;
    background-color:var(--biru-tua);
  }
  .slide.active{ opacity:1; z-index:2; }

  .slide::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(to top, rgba(14,23,48,.94) 0%, rgba(14,23,48,.75) 22%, rgba(27,46,110,.15) 52%, rgba(14,23,48,.35) 100%);
  }

  .slide-content{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:6vh 6vw 8vh;
    color:#fff;
    transform:translateY(24px);
    opacity:0;
    transition:transform 700ms ease 200ms, opacity 700ms ease 200ms;
  }
  .slide.active .slide-content{ transform:translateY(0); opacity:1; }

  .meta-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:1.4vh;
  }
  .meta-date{
    font-size:clamp(13px,1.3vw,17px);
    font-weight:600;
    color:var(--oranye);
    letter-spacing:.02em;
  }
  .meta-sep{
    width:5px; height:5px; border-radius:50%;
    background:rgba(255,255,255,.5);
  }
  .meta-source{
    font-size:clamp(12px,1.1vw,15px);
    color:rgba(255,255,255,.72);
  }

  .title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(28px,4.6vw,64px);
    line-height:1.08;
    max-width:78ch;
    text-wrap:balance;
  }

  /* ---------- Top bar: wordmark + jam ---------- */
  .topbar{
    position:absolute;
    top:0; left:0; right:0;
    z-index:10;
    padding:4.5vh 6vw 0;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:4vw;
  }
  .wordmark{
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(14px,1.4vw,19px);
    text-shadow:0 2px 12px rgba(0,0,0,.45);
    white-space:nowrap;
  }
  .wordmark .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--oranye);
  }

  .clock{
    text-align:right;
    text-shadow:0 2px 12px rgba(0,0,0,.45);
  }
  .clock-time{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(16px,1.9vw,28px);
    color:#fff;
    line-height:1.15;
  }
  .clock-date{
    font-size:clamp(11px,1.05vw,14px);
    color:rgba(255,255,255,.78);
  }

  /* ---------- QR code baca berita ---------- */
  .qr-box{
    position:absolute;
    right:6vw;
    bottom:8vh;
    background:#fff;
    border-radius:14px;
    padding:10px 10px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
    z-index:3;
  }
  .qr-box .qr-canvas-wrap{
    width:clamp(64px,7vw,96px);
    height:clamp(64px,7vw,96px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .qr-box .qr-canvas-wrap img,
  .qr-box .qr-canvas-wrap canvas{
    width:100% !important;
    height:100% !important;
  }
  .qr-box .qr-label{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    color:var(--biru-tua);
    text-align:center;
    max-width:96px;
    line-height:1.25;
  }
  @media (max-width:640px){
    .qr-box{ right:5vw; bottom:auto; top:14vh; padding:8px 8px 6px; }
  }

  /* ---------- Tap zones for manual nav ---------- */
  .navzone{
    position:absolute;
    top:0; bottom:0;
    width:20%;
    z-index:5;
  }
  .navzone.prev{ left:0; }
  .navzone.next{ right:0; }

  /* ---------- States ---------- */
  .state-screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:18px;
    background:linear-gradient(160deg,var(--biru-tua),var(--ink));
    color:#fff;
    text-align:center;
    padding:0 8vw;
    z-index:20;
  }
  .state-screen.hidden{ display:none; }
  .state-screen .mark{
    width:56px; height:56px; border-radius:16px;
    background:var(--oranye);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:26px; color:var(--biru-tua);
  }
  .state-screen h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(20px,2.6vw,30px);
  }
  .state-screen p{
    color:rgba(255,255,255,.65);
    font-size:clamp(13px,1.3vw,16px);
    max-width:52ch;
  }
  .spinner{
    width:26px; height:26px;
    border:3px solid rgba(255,255,255,.25);
    border-top-color:var(--biru-terang);
    border-radius:50%;
    animation:spin 900ms linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="app">

  <div class="topbar">
    <div class="wordmark"><span class="dot"></span>SMK Muhammadiyah Todanan</div>
    <div class="clock">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate">&nbsp;</div>
    </div>
  </div>

  <div id="slides"></div>

  <div class="navzone prev" id="zonePrev"></div>
  <div class="navzone next" id="zoneNext"></div>

  <div class="state-screen" id="loadingScreen">
    <div class="spinner"></div>
    <h1>Memuat berita terbaru&hellip;</h1>
  </div>

  <div class="state-screen hidden" id="errorScreen">
    <div class="mark">M</div>
    <h1>Belum bisa memuat berita</h1>
    <p id="errorDetail">Periksa koneksi internet, atau pastikan REST API WordPress aktif di website sekolah.</p>
  </div>

  <div class="state-screen hidden" id="emptyScreen">
    <div class="mark">M</div>
    <h1>Belum ada artikel</h1>
    <p>Slider akan otomatis menampilkan berita begitu ada artikel baru di website sekolah.</p>
  </div>

</div>

<script>
/* ============ Konfigurasi ============ */
const CONFIG = {
  // Diambil lewat Cloudflare Pages Function (functions/api/articles.js),
  // bukan langsung ke WordPress, supaya tidak kena blokir CORS browser.
  apiUrl: '/api/articles',
  imageProxyUrl: '/api/image?url=', // dipakai supaya foto bisa dianalisis kanvas (lihat computeFocalPoint)
  wpOrigin: 'https://smkmuhammadiyahtodanan.sch.id', // untuk melengkapi URL gambar yang ditulis relatif
  imageDurationMs: 6000,        // lama tampil tiap FOTO (bukan per artikel)
  maxImagesPerArticle: 5,       // batas jumlah foto yang diambil dari satu artikel
  smartCropStrength: 0.7,       // 0 = selalu tengah, 1 = ikuti hasil deteksi 100% (lihat computeFocalPoint)
  smartCropMargin: 15,          // % — batas seberapa dekat titik fokus boleh ke tepi gambar
  refreshDataEveryMs: 15 * 60 * 1000, // ambil ulang data tiap 15 menit
  cacheKey: 'muhada-slider-articles-v2',
  focalCacheKey: 'muhada-slider-focal-v2'
};

let articles = [];   // data mentah per artikel (judul, tanggal, daftar gambar)
let queue = [];      // hasil "diratakan": satu entri per foto, judul artikel bisa berulang
let currentIndex = 0;
let slideTimer = null;

// Titik fokus tiap gambar yang sudah dihitung (persisten lintas sesi/reboot TV,
// supaya tidak perlu dianalisis ulang tiap kali halaman dibuka).
let focalCache = {};
try{ focalCache = JSON.parse(localStorage.getItem(CONFIG.focalCacheKey) || '{}'); }catch(e){ focalCache = {}; }

const slidesEl = document.getElementById('slides');
const loadingScreen = document.getElementById('loadingScreen');
const errorScreen = document.getElementById('errorScreen');
const emptyScreen = document.getElementById('emptyScreen');
const clockTimeEl = document.getElementById('clockTime');
const clockDateEl = document.getElementById('clockDate');

function decodeHtml(html){
  const txt = document.createElement('textarea');
  txt.innerHTML = html;
  return txt.value;
}

function formatDate(iso){
  try{
    return new Date(iso).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  }catch(e){ return ''; }
}

function proxyImage(url){
  return url ? CONFIG.imageProxyUrl + encodeURIComponent(url) : null;
}

// Ubah URL relatif ("/wp-content/uploads/x.jpg") jadi URL lengkap terhadap
// domain website sekolah — beberapa artikel lama kadang menyimpan gambar
// dengan path relatif, yang kalau dibiarkan akan gagal dimuat sama sekali.
function resolveImageUrl(raw){
  if (!raw) return null;
  if (raw.startsWith('data:')) return null; // placeholder base64 dari lazy-load, bukan gambar asli
  try{
    return new URL(raw, CONFIG.wpOrigin).href;
  }catch(e){
    return null;
  }
}

// Pilih versi gambar dengan resolusi PALING TINGGI yang tersedia di WordPress
// (bandingkan semua ukuran terdaftar + file aslinya), supaya detailnya
// maksimal saat ditampilkan fullscreen di TV/layar besar.
function pickHighestResUrl(media){
  let bestUrl = media.source_url;
  let bestWidth = (media.media_details && media.media_details.width) || 0;
  const sizes = media.media_details && media.media_details.sizes;
  if (sizes){
    Object.keys(sizes).forEach(key => {
      const s = sizes[key];
      if (s && s.source_url && s.width && s.width > bestWidth){
        bestWidth = s.width;
        bestUrl = s.source_url;
      }
    });
  }
  return bestUrl;
}

function extractImages(post){
  const images = [];

  // 1. Foto unggulan (featured image) artikel — diutamakan tampil duluan,
  //    resolusi setinggi mungkin.
  const media = post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0];
  if (media) {
    const resolved = resolveImageUrl(pickHighestResUrl(media));
    if (resolved) images.push(proxyImage(resolved));
  }

  // 2. Semua gambar lain yang ada di isi/body artikel.
  try{
    const html = (post.content && post.content.rendered) || '';
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('img').forEach(img => {
      // Banyak tema/plugin lazy-load menyimpan URL asli di salah satu atribut
      // data-* ini, dan menyisakan placeholder kosong/buram di "src".
      let raw =
        img.getAttribute('data-lazy-src') ||
        img.getAttribute('data-src') ||
        img.getAttribute('data-original') ||
        img.getAttribute('src');

      const srcset = img.getAttribute('srcset') || img.getAttribute('data-srcset') || img.getAttribute('data-lazy-srcset');
      if (srcset){
        const candidates = srcset.split(',').map(c => c.trim().split(/\s+/)).filter(c => c[0]);
        if (candidates.length){
          candidates.sort((a,b) => (parseInt(b[1])||0) - (parseInt(a[1])||0));
          raw = candidates[0][0];
        }
      }

      const resolved = resolveImageUrl(raw);
      const src = proxyImage(resolved);
      if (src && !images.includes(src)) images.push(src);
    });
  }catch(e){ /* abaikan kalau parsing gagal */ }

  return images.slice(0, CONFIG.maxImagesPerArticle);
}

function extractArticle(post){
  return {
    title: decodeHtml(post.title ? post.title.rendered : ''),
    date: post.date,
    link: post.link,
    images: extractImages(post)
  };
}

/* Meratakan daftar artikel jadi satu entri per FOTO — mirip "Stories":
   selama masih di artikel yang sama, judul tetap sama, cuma fotonya berganti.
   Gambar yang sama (mis. dipakai ulang di beberapa artikel) hanya muncul
   sekali — pada kemunculan pertamanya saja. */
function buildQueue(articleList){
  const q = [];
  const usedImages = new Set();
  articleList.forEach(a => {
    let imgs = a.images.filter(img => !usedImages.has(img));
    imgs.forEach(img => usedImages.add(img));
    if (imgs.length === 0) imgs = [null]; // artikel tetap tampil walau semua fotonya duplikat
    imgs.forEach((image, i) => {
      q.push({
        title: a.title,
        date: a.date,
        link: a.link,
        image,
        isNewArticle: i === 0
      });
    });
  });
  return q;
}

/* ============ Ambil data dari WordPress ============ */
async function fetchArticles(){
  const res = await fetch(CONFIG.apiUrl, { cache:'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const posts = await res.json();
  if (!Array.isArray(posts)) throw new Error('Format respons tidak sesuai');
  return posts.map(extractArticle).filter(a => a.title);
}

async function loadData(isBackgroundRefresh){
  try{
    const fresh = await fetchArticles();
    if (fresh.length === 0){
      if (!isBackgroundRefresh) showState('empty');
      return;
    }
    articles = fresh;
    localStorage.setItem(CONFIG.cacheKey, JSON.stringify({ savedAt:Date.now(), articles }));
    if (!isBackgroundRefresh) {
      renderSlides();
      showState('ready');
      startSlideshow();
    } else {
      renderSlides(true);
    }
  }catch(err){
    console.error('Gagal mengambil data:', err);
    if (!isBackgroundRefresh){
      const cached = loadCache();
      if (cached && cached.length){
        articles = cached;
        renderSlides();
        showState('ready');
        startSlideshow();
      } else {
        document.getElementById('errorDetail').textContent =
          'Tidak bisa terhubung ke ' + CONFIG.apiUrl + ' — ' + err.message;
        showState('error');
      }
    }
  }
}

function loadCache(){
  try{
    const raw = localStorage.getItem(CONFIG.cacheKey);
    if (!raw) return null;
    return JSON.parse(raw).articles || null;
  }catch(e){ return null; }
}

function showState(state){
  loadingScreen.classList.toggle('hidden', state !== 'loading');
  errorScreen.classList.toggle('hidden', state !== 'error');
  emptyScreen.classList.toggle('hidden', state !== 'empty');
}

/* ============ Deteksi titik fokus otomatis (smart-crop) ============
   Menganalisis tiap foto (tepi, warna kulit, area kontras tinggi) untuk
   menentukan bagian mana yang paling penting, lalu itu yang dijadikan
   pusat crop — bukan selalu tengah gambar mentah-mentah. */
function saveFocalCache(){
  try{ localStorage.setItem(CONFIG.focalCacheKey, JSON.stringify(focalCache)); }catch(e){ /* penuh/diblokir, abaikan */ }
}

function loadImageEl(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function computeFocalPoint(src){
  if (!src) return null;
  if (focalCache[src]) return focalCache[src];
  if (typeof smartcrop === 'undefined') return null; // library gagal dimuat, pakai posisi tengah

  try{
    const img = await loadImageEl(src);
    const targetW = Math.max(window.innerWidth || 0, 800);
    const targetH = Math.max(window.innerHeight || 0, 450);
    const result = await smartcrop.crop(img, { width: targetW, height: targetH, minScale: 1 });
    const c = result.topCrop;
    const rawXPct = (( c.x + c.width / 2) / img.naturalWidth) * 100;
    const rawYPct = (( c.y + c.height / 2) / img.naturalHeight) * 100;

    // Redam hasil deteksi supaya tidak terlalu ekstrem kalau tebakannya
    // meleset (dicampur sebagian ke tengah), dan jangan biarkan titik
    // fokus terlalu mepet ke tepi gambar (crop di ujung sering terlihat
    // janggal / memotong objek penting).
    const s = CONFIG.smartCropStrength;
    const m = CONFIG.smartCropMargin;
    let xPct = 50 + (rawXPct - 50) * s;
    let yPct = 50 + (rawYPct - 50) * s;
    xPct = Math.min(100 - m, Math.max(m, xPct));
    yPct = Math.min(100 - m, Math.max(m, yPct));

    const pos = xPct.toFixed(1) + '% ' + yPct.toFixed(1) + '%';
    focalCache[src] = pos;
    saveFocalCache();
    return pos;
  }catch(e){
    return null; // gambar gagal dimuat/dianalisis -> tetap tampil, posisi default tengah
  }
}

function ensureFocalPoint(index){
  const s = queue[index];
  if (!s || !s.image) return;
  const el = document.querySelectorAll('.slide')[index];
  if (!el || el.dataset.focalDone) return;
  el.dataset.focalDone = '1';
  computeFocalPoint(s.image).then(pos => {
    if (pos) el.style.backgroundPosition = pos;
  });
}

// Hitung untuk slide yang sedang tampil + 2 slide berikutnya, supaya saat
// gilirannya tiba, titik fokusnya sudah siap (tidak "lompat" posisinya).
function prefetchFocalAround(index){
  if (queue.length === 0) return;
  ensureFocalPoint(index);
  ensureFocalPoint((index + 1) % queue.length);
  ensureFocalPoint((index + 2) % queue.length);
}

/* ============ Render slide ============ */
function renderSlides(preserveIndex){
  queue = buildQueue(articles);
  slidesEl.innerHTML = '';

  queue.forEach((s) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    if (s.image) slide.style.backgroundImage = `url("${s.image}")`;
    slide.innerHTML = `
      <div class="slide-content">
        <div class="meta-row">
          <span class="meta-date">${formatDate(s.date)}</span>
          <span class="meta-sep"></span>
          <span class="meta-source">Berita SMK Muhammadiyah Todanan</span>
        </div>
        <div class="title">${s.title}</div>
      </div>
      <div class="qr-box">
        <div class="qr-canvas-wrap"></div>
        <div class="qr-label">Scan untuk baca berita lengkap</div>
      </div>`;
    slidesEl.appendChild(slide);
    renderQrCode(slide, s.link);
  });

  if (!preserveIndex || currentIndex >= queue.length) currentIndex = 0;
  updateActiveSlide();
}

function renderQrCode(slideEl, link){
  if (!link || typeof QRCode === 'undefined') {
    const box = slideEl.querySelector('.qr-box');
    if (box) box.style.display = 'none';
    return;
  }
  const wrap = slideEl.querySelector('.qr-canvas-wrap');
  try{
    new QRCode(wrap, {
      text: link,
      width: 96,
      height: 96,
      colorDark: '#1B2E6E',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }catch(e){
    const box = slideEl.querySelector('.qr-box');
    if (box) box.style.display = 'none';
  }
}

function updateActiveSlide(){
  const slideEls = document.querySelectorAll('.slide');
  slideEls.forEach((el,i)=>{
    const isActive = i === currentIndex;
    if (isActive && queue[i] && !queue[i].isNewArticle){
      // Foto baru, artikel sama: tampilkan teks langsung tanpa animasi
      // masuk lagi, supaya judul terasa "menetap" selama masih 1 artikel.
      const content = el.querySelector('.slide-content');
      content.style.transition = 'none';
      el.classList.add('active');
      void content.offsetWidth;
      content.style.transition = '';
    } else {
      el.classList.toggle('active', isActive);
    }
  });
}

function goTo(index){
  if (queue.length === 0) return;
  currentIndex = (index + queue.length) % queue.length;
  updateActiveSlide();
  resetTimer();
  prefetchFocalAround(currentIndex);
}

function nextSlide(){ goTo(currentIndex + 1); }
function prevSlide(){ goTo(currentIndex - 1); }

function resetTimer(){
  clearTimeout(slideTimer);
  slideTimer = setTimeout(nextSlide, CONFIG.imageDurationMs);
}

function startSlideshow(){
  clearTimeout(slideTimer);
  currentIndex = 0;
  updateActiveSlide();
  resetTimer();
  prefetchFocalAround(currentIndex);
}

/* ============ Jam & tanggal ============ */
function updateClock(){
  const now = new Date();
  clockTimeEl.textContent = now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
  clockDateEl.textContent = now.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
updateClock();
setInterval(updateClock, 1000 * 30); // cukup tiap 30 detik, jam tidak perlu presisi detik

/* ============ Navigasi manual (tap / swipe) ============ */
document.getElementById('zonePrev').addEventListener('click', prevSlide);
document.getElementById('zoneNext').addEventListener('click', nextSlide);

let touchStartX = null;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { dx > 0 ? prevSlide() : nextSlide(); }
  touchStartX = null;
}, {passive:true});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

/* ============ Boot ============ */
showState('loading');
loadData(false);
